# yolo26 at WIDTH 0.375 -- an intermediate size between n (0.25) and s (0.50).
#
# WHY THIS FILE EXISTS
# The n/s/m/l/x family leaves a large hole between n (2.6M params) and
# s (9.5M). Every compression route we tried (pruning, width-elastic,
# depth-elastic) failed to produce a point beating that family curve, because
# they all remove capacity from an already-trained model. The untested route is
# the one that built the family in the first place: train an intermediate size.
# Width 0.375 lands at ~5.6M params, squarely in the gap.
#
# HOW THE SCALE LETTER WORKS
# ultralytics' guess_model_scale() only recognises [nslmx], so a custom letter
# like 'q' cannot be parsed. It also rewrites "yolo26<letter>-<suffix>.yaml" ->
# "yolo26-<suffix>.yaml" to find the shared architecture file. So:
#   load it as  yolo26s-w375.yaml   -> resolves to THIS file, scale 's'
# and the 's' entry below is deliberately set to width 0.375, not 0.50.
# The other entries are left at their stock values and are unused here.
#
# CHANNEL COMPATIBILITY WITH yolo26s (deliberate)
# make_divisible(c * 0.375, 8) is EXACTLY 0.75x make_divisible(c * 0.50, 8) for
# every base channel count in this architecture (64->24/32, 128->48/64,
# 256->96/128, 512->192/256, 1024->384/512). So a yolo26s checkpoint sliced at
# w=0.75 transfers into this model shape-for-shape, which is how we initialise
# it from the public Objects365 checkpoint.

nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.375, 1024] # <-- width 0.375, NOT 0.50. See header.
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
